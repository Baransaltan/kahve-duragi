<script>
// ===== DEVICE FIT: telefon / tablet otomatik algılama =====
// Tablette tüm arayüz (HUD, paneller, yazılar) viewport ölçeğiyle büyütülür; 3D sahne keskin kalsın diye pixelRatio telafi edilir.
window.DEV={tab:false,land:false,u:1,S:1};
window.SET={sfx:1,vib:1,q:'auto'};try{Object.assign(SET,JSON.parse(localStorage.getItem('kahve_set')||'{}'))}catch(e){}
window.QLOW=SET.q==='low';
function fitDevice(){
 const sw=screen.width||innerWidth,sh=screen.height||innerHeight,mn=Math.min(sw,sh),mx=Math.max(sw,sh);
 const land=(window.matchMedia&&matchMedia('(orientation: landscape)').matches)||innerWidth>innerHeight;
 const tab=mn>=600&&('ontouchstart' in window||navigator.maxTouchPoints>0);
 let u=tab?Math.min(1.75,Math.max(1.2,mn/480)):1;if(tab&&land)u=Math.max(1.15,Math.min(u,mn/570)); // yatayda dikey alan dar kalmasın
 const curW=land?mx:mn;
 DEV.tab=tab;DEV.land=land;DEV.u=u;DEV.curW=curW;
 const m=document.querySelector('meta[name=viewport]');
 const c=tab?`width=${Math.round(curW/u)},user-scalable=no,viewport-fit=cover`:'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
 if(m&&m.getAttribute('content')!==c)m.setAttribute('content',c);
 const r=document.documentElement;r.classList.toggle('tab',tab);r.classList.toggle('phone',!tab);r.classList.toggle('land',land);
}
fitDevice();
addEventListener('orientationchange',()=>setTimeout(fitDevice,60));
</script>

<script>
// Direction-matching retargeter: bakes mixamo clips from a source rig onto any mixamo-named rig whose rest pose differs.
const RT_CHAIN=[['Hips',null],['Spine','Spine1'],['Spine1','Spine2'],['Spine2','Neck'],['Neck','Head'],['Head',null],
 ['LeftShoulder','LeftArm'],['LeftArm','LeftForeArm'],['LeftForeArm','LeftHand'],['LeftHand','LeftHandMiddle1'],
 ['RightShoulder','RightArm'],['RightArm','RightForeArm'],['RightForeArm','RightHand'],['RightHand','RightHandMiddle1'],
 ['LeftUpLeg','LeftLeg'],['LeftLeg','LeftFoot'],['LeftFoot','LeftToeBase'],['RightUpLeg','RightLeg'],['RightLeg','RightFoot'],['RightFoot','RightToeBase']];
const RT_FPS=30;
function rtSampleSource(srcScene,clips){
 const bones={};srcScene.traverse(o=>{if(/mixamorig/.test(o.name)&&!o.isMesh){const k=o.name.replace(/^.*mixamorig/,'').replace(/_\d+$/,'');if(!bones[k]||o.isBone)bones[k]=o}});
 const inv=new THREE.Matrix4();srcScene.updateMatrixWorld(true);inv.copy(srcScene.matrixWorld).invert();
 const mx=new THREE.AnimationMixer(srcScene);const out={};const v=new THREE.Vector3(),q=new THREE.Quaternion(),tmp=new THREE.Matrix4();
 clips.forEach(clip=>{const act=mx.clipAction(clip);act.reset().play();const n=Math.max(2,Math.round(clip.duration*RT_FPS)+1);const frames=[];
  for(let f=0;f<n;f++){mx.setTime(Math.min(clip.duration,f/RT_FPS));srcScene.updateMatrixWorld(true);const P={},Q={};
   for(const k in bones){tmp.multiplyMatrices(inv,bones[k].matrixWorld);v.setFromMatrixPosition(tmp);P[k]=v.clone();q.setFromRotationMatrix(tmp);Q[k]=q.clone()}frames.push({P,Q})}
  act.stop();out[clip.name]={dur:clip.duration,frames}});
 // reference proportions
 const hips0=out[clips[0].name].frames[0].P;return{data:out,legLen:Math.abs(hips0.Hips.y-(hips0.LeftFoot?hips0.LeftFoot.y:0))||1};
}
function rtBuild(target,src){
 const T={};target.traverse(o=>{if(/mixamorig/.test(o.name)&&!o.isMesh){const k=o.name.replace(/^.*mixamorig/,'').replace(/_\d+$/,'');if(!T[k]||o.isBone)T[k]=o}});
 target.updateMatrixWorld(true);const inv=new THREE.Matrix4().copy(target.matrixWorld).invert();const tmp=new THREE.Matrix4();
 const restP={},restQ={},restL={};for(const k in T){tmp.multiplyMatrices(inv,T[k].matrixWorld);restP[k]=new THREE.Vector3().setFromMatrixPosition(tmp);restQ[k]=new THREE.Quaternion().setFromRotationMatrix(tmp);restL[k]=T[k].quaternion.clone()}
 // facing: toes ahead of feet tells which way the rig looks
 let face=1;if(restP.LeftToeBase&&restP.LeftFoot)face=Math.sign(restP.LeftToeBase.z-restP.LeftFoot.z)||1;
 const fl=v=>new THREE.Vector3(v.x*face,v.y,v.z*face);
 const tLeg=Math.abs(restP.Hips.y-(restP.LeftFoot?restP.LeftFoot.y:0))||1,scale=tLeg/src.legLen;
 const clips={};const V=THREE.Vector3,Qt=THREE.Quaternion;
 for(const name in src.data){const S=src.data[name];const tracks={};const times=[];const hipsY=[];

let MUS=null,musicOn=true;try{musicOn=localStorage.getItem('kahve_music')!=='0'}catch(e){}
function startMusic(){if(!AC||MUS)return;const master=AC.createGain();master.gain.value=musicOn?.13:0;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;master.connect(lp).connect(AC.destination);
 const bpm=86,beat=60/bpm,f=n=>440*Math.pow(2,(n-69)/12);
 const prog=[[50,[62,65,69,72]],[43,[59,62,65,69]],[48,[59,64,67,71]],[45,[61,64,67,71]],[50,[62,65,69,72]],[43,[59,62,65,69]],[48,[60,64,67,71]],[48,[60,64,67,74]]];
 const mel=[76,0,74,72,0,69,0,0, 71,0,72,74,0,77,76,0, 76,0,0,79,0,76,74,0, 73,0,71,0,69,0,0,0, 74,0,72,74,0,77,0,76, 74,0,71,0,67,0,0,0, 72,0,74,76,0,79,0,0, 76,0,74,0,72,0,0,0];
 const ep=(n,t,v,d)=>{for(const[type,det,vv]of[['sine',0,1],['triangle',3,.35]]){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f(n);o.detune.value=det;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*vv,t+.015);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}};
 const bass=(n,t,d)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f(n);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)};
 const brush=(t,v)=>{const b=AC.createBuffer(1,3300,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=v;const hp=AC.createBiquadFilter();hp.type='bandpass';hp.frequency.value=7000;s.connect(hp).connect(g).connect(master);s.start(t)};
 const kick=t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(master);o.start(t);o.stop(t+.2)};
 let next=AC.currentTime+.15,step=0;
 MUS={master,timer:setInterval(()=>{while(next<AC.currentTime+.4){const bar=Math.floor(step/8)%8,e=step%8,[root,ch]=prog[bar];const sw=e%2?beat*.08:0,t=next+sw;
  if(e===0||e===3||e===6)ch.forEach((n,i)=>ep(n,t+i*.012,e===0?.045:.032,e===6?.7:1.1));
  if(e===0)bass(root,t,beat*1.4);if(e===4)bass(root+7,t,beat*1.2);if(e===7)bass(root+(bar%2?2:-1),t,beat*.4);
  if(e===0||e===4)kick(t);brush(t,e%2?.05:.025);
  const m=mel[step%64];if(m&&Math.floor(step/64)%2===0)ep(m+12,t,.05,.9);
  next+=beat/2;step++}},120)}}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('kahve_music',musicOn?'1':'0')}catch(e){}if(MUS)MUS.master.gain.value=musicOn?.13:0;}

 const outz=p.z>12.1;p.x=clamp(p.x,outz?-14:-9.6,outz?14:9.6);p.z=clamp(p.z,-8.1,LVI()===1?24.5:17.6);
 for(const s of solids){if(p.x>s.x0-r&&p.x<s.x1+r&&p.z>s.z0-r&&p.z<s.z1+r){const dl=p.x-(s.x0-r),dr=(s.x1+r)-p.x,dt=p.z-(s.z0-r),db=(s.z1+r)-p.z,m=Math.min(dl,dr,dt,db);if(m===dl)p.x=s.x0-r;else if(m===dr)p.x=s.x1+r;else if(m===dt)p.z=s.z0-r;else p.z=s.z1+r}}
}
const pv=new V3();let actT=0;
function updatePlayer(dt){
 let ix=joy.dx,iz=joy.dy;if(keys['a']||keys['arrowleft'])ix=-1;if(keys['d']||keys['arrowright'])ix=1;if(keys['w']||keys['arrowup'])iz=-1;if(keys['s']||keys['arrowdown'])iz=1;
 const m=Math.min(1,Math.hypot(ix,iz));const tgt=new V3(ix,0,iz);if(m>.12)tgt.normalize().multiplyScalar(playerSpeed()*(.35+.65*m));else tgt.set(0,0,0);
 pv.lerp(tgt,1-Math.exp(-dt*16));
 const p=player.root.position,before=p.clone();p.addScaledVector(pv,dt);collide(p);
 const real=p.clone().sub(before).multiplyScalar(1/Math.max(dt,1e-4));animChar(player,dt,real);
 actT-=dt;if(actT>0)return;
 // interactions (one action per tick → the satisfying one-by-one rhythm)
 // makineden alma: ilki anında, sonra kısa bir duraklama → hızlıca girip çıkan 1 tane alır, bekleyen fazlasını toplar
 {let nearM=null;for(const mc of machines){if(near(player,mc.zone)){nearM=mc;if(mc.tray.length&&player.stack.length<capacity()){if(player.pickM!==mc){player.pickM=mc;player.pickN=0}
   const it=mc.tray.pop();takeTo(player,it);actT=player.pickN===0?1:.2;player.pickN++;return}}}if(!nearM)player.pickM=null}
 if(reg){
  if(near(player,{x:REGZ.x,z:REGZ.z,r:1.1})){const c=queueFront();if(c&&c.state==='wait'&&!c.served){const i=findItem(player.stack,c.order);if(i>=0){serve(c,player.stack.splice(i,1)[0]);actT=.25;return}const j=findItem(reg.stock,c.order);if(j>=0){const it=reg.stock.splice(j,1)[0];relayoutStock();serve(c,it);actT=.25;return}}}
  if(near(player,{x:DROP.x,z:DROP.z,r:1.0})&&player.stack.length&&canStock()){const j=pickFree(k=>canDrop(k));if(j>=0){const it=player.stack.splice(j,1)[0];dropToStock(it);actT=.08;return}}
  if(near(player,{x:PILE.x,z:PILE.z+.2,r:1.5})&&reg.pile.length){collectPile();actT=.03;return}
  if(player.stack.length&&near(player,{x:TRASH.x,z:TRASH.z,r:1.25})){player.binT=(player.binT||0)+(pv.length()<1.4?dt:0);if(player.binT>.25){const j=player.stack.length-1;if(j>=0){const it=player.stack.splice(j,1)[0];trashItem(it,player);actT=.08;return}}}else player.binT=0;
 }
 if(outDeliver())return;
 if(WCS&&WCS.dirt>0&&near(player,WCS.zone)){WCS.clean+=.07;player.squash=Math.max(player.squash||0,.3);if(WCS.clean>=1)cleanWC();actT=.06;return}
 for(const t of tables){if(t.dirty&&near(player,t.zone)){t.clean+=dt*0+.06;if(t.clean>=.6){cleanTable(t,player)}actT=.06;return}}
 for(const pd of pads){if(near(player,pd.zone)&&G.money>0&&pd.paid<pd.cost){payPad(pd);actT=.045;return}}
 if(board&&near(player,board.zone)&&!panelOpen()&&!player.boardLock){player.boardLock=true;openBoard()}
 if(board&&!near(player,{x:board.zone.x,z:board.zone.z,r:1.6}))player.boardLock=false;
}

 fly(it,()=>{let y=0;for(let i=0;i<idx;i++)y+=ITEM_H[c.stack[i]?.userData.kind||'coffee'];return c.carry.localToWorld(new V3(0,y,0))},.22,.9,()=>{c.carry.attach(it);it.rotation.set(0,0,0);it.userData.flying=false;c.squash=.5;it.userData.pop={t:0,s:1.25}});

const CLOUD={ref:null,ok:false,busy:false,lastBody:'',lastW:0,pend:null};
function cloudStatus(t){const e=$('cloudSt');if(e)e.textContent=t}
async function cloudInit(){try{
 for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
 if(!(window.claude&&window.claude.use))return null;
 const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return null;
 const id=await user.id();if(!id)return null;CLOUD.ref=db.collection('data/users/'+id).doc('kahve');
 const snap=await Promise.race([CLOUD.ref.get(),new Promise(r=>setTimeout(()=>r('TO'),9000))]);
 if(snap==='TO')return null;CLOUD.ok=true;return snap&&snap.exists?snap.data():{}}catch(e){return null}}
function cloudQueue(force){if(!CLOUD.ok)return;const g=Object.assign({},G,{t:0});const body=JSON.stringify(g)+'|'+JSON.stringify(META);if(body===CLOUD.lastBody&&!force)return;
 CLOUD.pend={g:JSON.stringify(G),meta:JSON.stringify(META),t:Date.now(),v:3,_b:body};cloudFlush(force)}
async function cloudFlush(force){if(!CLOUD.pend||CLOUD.busy)return;if(!force&&Date.now()-CLOUD.lastW<12000){setTimeout(()=>cloudFlush(),12500-(Date.now()-CLOUD.lastW));return}
 const p=CLOUD.pend;CLOUD.pend=null;CLOUD.busy=true;const body=p._b;delete p._b;
 try{await CLOUD.ref.set(p);CLOUD.lastBody=body;CLOUD.lastW=Date.now();cloudStatus('☁️ Bulut kaydı açık · son kayıt '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}))}
 catch(e){if(e&&e.code==='unavailable'){CLOUD.pend=CLOUD.pend||Object.assign(p,{_b:body});setTimeout(()=>cloudFlush(true),2000+Math.random()*2000)}else if(e&&(e.code==='revoked'||e.code==='invalid_argument'||e.code==='not_granted')){CLOUD.ok=false;cloudStatus('⚠️ Bulut kaydı kullanılamıyor — kayıt kodunu sakla')}}
 CLOUD.busy=false;if(CLOUD.pend)cloudFlush()}

 let lg=load(),cg=null,cm=null;try{if(cloud&&cloud.g)cg=JSON.parse(cloud.g);if(cloud&&cloud.meta)cm=JSON.parse(cloud.meta)}catch(e){}
 const useCloud=cg&&(!lg||(cg.t||0)>(lg.t||0)||(cg.total||0)+(cg.lvl||0)*1e9>(lg.total||0)+(lg.lvl||0)*1e9&&(cg.t||0)>=(lg.t||0)-60000);
 if(useCloud&&cm)META=Object.assign(META,cm);
 return useCloud?cg:lg}

 else{const m=machOf(k);if(goVia(m.zone.x,m.zone.z)&&s.timer<=0&&m.tray.length){takeTo(c,m.tray.pop());s.timer=.15}}}

 const wages=staff.reduce((a,s)=>a+20*M*(1+.12*((s.d&&s.d.lv||1)-1)),0);if(wages)bills.push(['👥 Maaşlar',wages]);
 
 const on=(G.custom.deco||[]).length;const elec=(8+(FUNZ?12:0)+on*3)*M;bills.push(['💡 Elektrik & su',elec]);
 if(WCS)bills.push(['🧴 Temizlik malzemesi',6*M]);
 return bills}
function decoRep(){const c=G.custom||{};let r=0,parts=[];const d=(c.deco||[]).length;if(d){r+=.02*d;parts.push(d+' süs')}
 const dp=['dec1','dec2'].filter(has).length;if(dp){r+=.03*dp}
 const st=['wall','floor','cloth'].filter(k=>c[k]).length+(c.name?1:0)+(c.signc?1:0);if(st){r+=.015*st}
 return Math.min(.2,r)}
function dayEnd(){if(!started||!has('reg'))return;G.day=(G.day||1)+1;const inc=G.dayInc||0;G.dayInc=0;G.lastInc=inc;
 const bills=dayBills(),tot=bills.reduce((a,b)=>a+b[1],0),paid=Math.min(G.money,tot);G.money-=paid;$('mv').textContent=fmt(G.money);G.dayExp=tot;
 const owe=tot-paid,late=(G.debt||0)>.5;if(late)repAdd(-.05);G.debt=(G.debt||0)+(owe>.5?owe:0);updateDayHUD();const dr=decoRep();if(dr>0)repAdd(dr);
 const net=inc-tot;
 $('daycard').innerHTML=`<div class="dh">🌅 ${G.day-1}. gün bitti</div><div class="dr"><span>Gelir</span><b style="color:#2f9a46">+$${fmt(inc)}</b></div>`+bills.map(b=>`<div class="dr s"><span>${b[0]}</span><b>-$${fmt(b[1])}</b></div>`).join('')+
  `<div class="dr t"><span>Net</span><b style="color:${net>=0?'#2f9a46':'#c0504d'}">${net>=0?'+':'-'}$${fmt(Math.abs(net))}</b></div>`+(dr>0?`<div class="dr s"><span>🌸 Dekor ünü</span><b style="color:#c96a2f">+${dr.toFixed(2)} ⭐</b></div>`:'')+(owe>.5?`<div class="dr s" style="color:#c0504d">Kasada $${fmt(owe)} eksik kaldı → borç olarak sonraki kazançlardan düşülecek</div>`:'')+(late?`<div class="dr s" style="color:#c0504d">Dünkü borç kapanmadı (-0.05 ⭐)</div>`:'');
 $('daycard').classList.add('open');clearTimeout(window._dcT);window._dcT=setTimeout(()=>$('daycard').classList.remove('open'),7000);SFX.unlock();save()}
