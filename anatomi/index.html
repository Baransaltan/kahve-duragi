<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f1ff">
<title>AnatoLab · Üst Ekstremite</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ff;--ink:#2d2350;--sub:#7b6f9e;--card:#fff;--pri:#7c5cff;--pri2:#a58bff;--ok:#2fb873;--bad:#ff5a6a;--bone:#efe4cf;--mus:#e0605a;--ner:#f2c230;--art:#e8343f;--vein:#4a78e0;--sh:0 4px 0 #e2d9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Nunito,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
button{font:inherit;border:none;cursor:pointer;color:inherit}
.top{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.pill{pointer-events:auto;background:rgba(255,255,255,.94);border-radius:16px;padding:7px 12px;box-shadow:var(--sh);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
#prof{flex:1;min-width:0}#prof .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prof .xp{height:6px;border-radius:4px;background:#ece6ff;margin-top:3px;overflow:hidden}#prof .xp div{height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));width:0;transition:width .4s}
#prof small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.chip{font-size:14px}

.regs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 6px}.rg{background:var(--card,#fff);border-radius:16px;padding:8px 2px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:11px;color:var(--ink)}.rg b{font-size:22px}.rg small{color:#f5a623;font-size:9px;letter-spacing:-1px}.rg.on{outline:3px solid var(--pri)}.rg.lock{opacity:.5}.rgd{font-size:11px;color:var(--sub);text-align:center;margin-bottom:8px;font-weight:700}
#layers{position:fixed;left:8px;top:calc(64px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:5}
#layers button{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:20px;position:relative;opacity:.45;transition:.15s}
#layers button.on{opacity:1}
#layers button i{position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%}
#tools{position:fixed;right:8px;top:calc(64px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:5}
#tools button{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:19px}
#tools button.on{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5a3fd6}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;background:rgba(255,255,255,.97);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(80,50,160,.08);border-radius:20px 20px 0 0}
#nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:800;color:var(--sub);padding:4px 0;border-radius:12px}
#nav button b{font-size:21px;line-height:1.15}
#nav button.on{color:var(--pri);background:#f1ecff}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:7;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(70,40,150,.18);padding:14px 16px;max-height:52vh;overflow:auto;transform:translateY(calc(100% + 140px));transition:transform .28s cubic-bezier(.2,1.2,.4,1)}
#sheet.open{transform:none}
#sheet h3{margin:0;font-size:19px;line-height:1.2}#sheet .en{color:var(--sub);font-weight:700;font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:9px;margin:6px 4px 0 0;color:#fff}
.fact{margin-top:8px;font-size:13.5px;line-height:1.4}.fact b{display:inline-block;min-width:22px;color:var(--pri)}
.row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;padding:10px;border-radius:14px;background:#f1ecff;color:var(--pri);font-weight:900;font-size:14px}
.btn.p{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5a3fd6}
#x{position:absolute;right:10px;top:8px;width:30px;height:30px;border-radius:50%;background:#f3f0fb;font-weight:900;color:var(--sub)}
#quiz{position:fixed;left:8px;right:8px;top:calc(64px + env(safe-area-inset-top));z-index:6;display:none;pointer-events:none}
#quiz .q{pointer-events:auto;margin:0 52px;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(70,40,150,.15);padding:10px 14px;text-align:center}
#quiz .q small{color:var(--sub);font-weight:800;font-size:11.5px;letter-spacing:.3px}
#quiz .q h4{margin:3px 0 0;font-size:17px;line-height:1.25}#quiz .q .en2{font-size:12.5px;color:var(--sub);font-weight:700}
#prog{height:5px;background:#ece6ff;border-radius:4px;margin-top:7px;overflow:hidden}#prog div{height:100%;background:var(--ok);width:0;transition:width .3s}
#opts{position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;display:none;flex-direction:column;gap:7px}
#opts button{background:#fff;border-radius:15px;padding:11px 14px;font-weight:800;font-size:14.5px;text-align:left;box-shadow:var(--sh);line-height:1.25}
#opts button small{display:block;font-weight:700;color:var(--sub);font-size:11.5px}
#opts button.ok{background:#e3f8ec;box-shadow:0 4px 0 #9fe3bf}#opts button.bad{background:#ffe6e9;box-shadow:0 4px 0 #ffb3bd}
#casebox{pointer-events:auto;margin:0 52px;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(70,40,150,.15);padding:12px 14px;font-size:14px;line-height:1.45;font-weight:700;max-height:34vh;overflow:auto;display:none}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:9;font-size:22px;font-weight:900;padding:12px 22px;border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:.22s;text-align:center;max-width:86vw}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#label{position:fixed;z-index:4;pointer-events:none;background:rgba(45,35,80,.88);color:#fff;font-weight:800;font-size:12.5px;padding:4px 9px;border-radius:10px;transform:translate(-50%,-140%);white-space:nowrap;display:none}
#home,#welcome{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#efe8ff,#fdf4ff 60%,#fff);overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.hero{text-align:center;margin-top:6px}.hero .ico{font-size:58px;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.hero h1{margin:4px 0 0;font-size:34px;font-weight:900;background:linear-gradient(90deg,#7c5cff,#e0508e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;color:var(--sub);font-weight:700}
.stats{display:flex;gap:8px;margin:18px 0 10px}.stat{flex:1;background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:20px}.stat small{color:var(--sub);font-weight:800;font-size:11px}
.goal{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:12px;font-weight:800}.goal .bar{height:10px;background:#ece6ff;border-radius:6px;margin-top:6px;overflow:hidden}.goal .bar div{height:100%;background:linear-gradient(90deg,#ffb347,#ff6f91);border-radius:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:#fff;border-radius:18px;padding:14px 12px;text-align:left;box-shadow:var(--sh)}.mode b{font-size:26px;display:block}.mode span{display:block;font-weight:900;font-size:15.5px;margin-top:2px}.mode small{color:var(--sub);font-weight:700;font-size:11.5px;line-height:1.3;display:block;margin-top:2px}
.region{margin:14px 0 4px;font-weight:900;color:var(--sub);font-size:12px;letter-spacing:.5px}
.reg{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.reg div{flex:0 0 auto;background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:13px;box-shadow:var(--sh)}.reg div.lock{opacity:.45}.reg div.cur{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5a3fd6}
.lang{display:flex;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:4px;margin-top:12px}.lang button{flex:1;padding:8px;border-radius:11px;background:none;font-weight:900;font-size:13px;color:var(--sub)}.lang button.on{background:var(--pri);color:#fff}
.cred{margin-top:16px;font-size:10.5px;color:#a99fc4;font-weight:700;text-align:center;line-height:1.4}
#welcome{z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#welcome input{font:inherit;font-weight:800;font-size:18px;padding:12px 16px;border-radius:16px;border:3px solid #e2d9ff;width:min(320px,90vw);text-align:center;margin:16px 0 10px;outline:none;background:#fff}
#welcome input:focus{border-color:var(--pri)}
.big{background:var(--pri);color:#fff;font-weight:900;font-size:18px;padding:13px 40px;border-radius:18px;box-shadow:0 5px 0 #5a3fd6}
#tracebar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}#tracebar span{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:8px;background:#f1ecff;color:var(--sub)}#tracebar span.d{background:#e3f8ec;color:#1f8a52}
#search{display:none;position:fixed;left:60px;right:60px;top:calc(64px + env(safe-area-inset-top));z-index:8}
#search input{width:100%;font:inherit;font-weight:800;padding:10px 14px;border-radius:14px;border:2px solid #e2d9ff;outline:none}
#sres{background:#fff;border-radius:14px;margin-top:6px;max-height:40vh;overflow:auto;box-shadow:0 6px 20px rgba(70,40,150,.15)}#sres div{padding:9px 12px;font-weight:800;font-size:13.5px;border-bottom:1px solid #f3f0fb}#sres div small{display:block;color:var(--sub);font-weight:700}
#load{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f6f1ff;font-weight:900;color:var(--sub)}#load .ico{font-size:50px;animation:bob 1.5s infinite}
.conf{position:fixed;z-index:50;pointer-events:none;font-size:22px;animation:cf 1.4s ease-out forwards}@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

#hud{display:flex;justify-content:center;gap:10px;font-size:13px;font-weight:900;margin-bottom:2px}#hud .cmb{color:#ff6a3d}
#tbar{height:6px;background:#ece6ff;border-radius:4px;margin-top:5px;overflow:hidden;display:none}#tbar div{height:100%;background:linear-gradient(90deg,#ffb347,#7c5cff);width:100%;transition:width .1s linear}#tbar.fz div{background:#8fd3ff!important}
#boss{display:none;pointer-events:auto;margin:0 52px 6px;background:linear-gradient(135deg,#2d2350,#4b3a8a);color:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 6px 18px rgba(45,35,80,.35)}
#boss .bh{font-weight:900;font-size:14px}#boss .hp{height:10px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:5px;overflow:hidden}#boss .hp div{height:100%;width:100%;background:linear-gradient(90deg,#ff5a6a,#ffb347);transition:width .4s}
#bossSay{font-size:12px;font-weight:700;margin-top:4px;opacity:.9}#bossSay.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}}
#pups{position:fixed;right:8px;top:calc(160px + env(safe-area-inset-top));z-index:6;display:none;flex-direction:column;gap:6px}#pups button{width:46px;height:50px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:19px;line-height:1}#pups small{display:block;font-size:10px;font-weight:900;color:#c9971a;margin-top:2px}
.shk{animation:shk .35s}@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.ftx{position:fixed;left:50%;top:22%;z-index:9;font-weight:900;font-size:28px;pointer-events:none;animation:ftx .9s ease-out forwards;transform:translateX(-50%)}@keyframes ftx{to{transform:translate(-50%,-40px);opacity:0}}
.st{display:flex;justify-content:center;gap:6px;font-size:40px;margin:6px 0}.st i{font-style:normal;color:#e6e0f5}.st i.on{color:#ffc93c;animation:stp .5s backwards;text-shadow:0 3px 0 #e0a21a}@keyframes stp{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hn{font-size:21px;font-weight:900}.hhead small{color:var(--sub);font-weight:800}.hs{display:flex;gap:6px}.hs span{background:#fff;border-radius:12px;padding:6px 10px;font-weight:900;box-shadow:var(--sh);font-size:14px}
.htabs{display:flex;gap:4px;background:#fff;border-radius:16px;padding:4px;box-shadow:var(--sh);margin-bottom:12px;position:sticky;top:0;z-index:2}.htabs button{flex:1;background:none;border-radius:12px;padding:6px 0;font-size:10.5px;font-weight:900;color:var(--sub);display:flex;flex-direction:column;align-items:center}.htabs b{font-size:19px}.htabs button.on{background:var(--pri);color:#fff}
.daily{width:100%;text-align:left;background:linear-gradient(135deg,#ffb347,#ff6f91);color:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 #d9506f;margin-bottom:12px}.daily b{font-size:16px;display:block}.daily small{font-weight:800;opacity:.95}.daily.done{background:linear-gradient(135deg,#9fe3bf,#5cc98f);box-shadow:0 4px 0 #3fa874}
.chap{background:#fff;border-radius:20px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:var(--sh)}.chh{display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-bottom:8px}.chh small{color:#e0a21a}
.path{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}.node{flex:0 0 84px;background:#f4f0ff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #e2d9ff}
.node b{font-size:26px;width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #d8ccff}.node.won b{background:#fff6d8;box-shadow:0 3px 0 #ffd56b}.node .ns{color:#ffc93c;font-size:13px;letter-spacing:1px}.node small{font-size:10px;font-weight:800;color:var(--sub);text-align:center;line-height:1.15;min-height:23px}
.node.lock{opacity:.45}.node.bossn{background:linear-gradient(160deg,#3b2d70,#6a4fc9);box-shadow:0 3px 0 #2a1f55}.node.bossn small{color:#fff}.node.bossn b{background:#ffd56b}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card2{background:#f1edf9;border-radius:14px;padding:8px 6px;text-align:center;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed #ddd3f3}
.card2 b{font-size:22px}.card2 span{font-size:10.5px;font-weight:800;line-height:1.15;color:var(--sub)}.card2.got{background:#fff;border:2px solid var(--cc);box-shadow:0 3px 0 var(--cc)}.card2.got span{color:var(--ink)}.card2.got.r2{background:linear-gradient(160deg,#fff,#eef6ff)}.card2.got.r3{background:linear-gradient(160deg,#fff8e0,#ffe9f5)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shopc{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:3px}.shopc b{font-size:28px}.shopc span{font-weight:900;font-size:14px}.shopc small{font-weight:800;color:#c9971a}.shopc.on{outline:3px solid var(--pri)}
.achs{display:flex;flex-direction:column;gap:7px}.ach{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:9px 12px;box-shadow:var(--sh);opacity:.55}.ach.got{opacity:1}.ach b{font-size:26px}.ach span{font-weight:900;display:block}.ach small{color:var(--sub);font-weight:700}
body.dark{--ink:#f1edff;--sub:#b3a9d9;--card:#2b2545}body.dark .pill,body.dark #sheet,body.dark #opts button,body.dark #quiz .q,body.dark #casebox,body.dark #nav,body.dark #layers button,body.dark #tools button,body.dark #pups button,body.dark .chap,body.dark .stat,body.dark .goal,body.dark .mode,body.dark .htabs,body.dark .hs span,body.dark .shopc,body.dark .ach,body.dark .card2,body.dark .lang,body.dark #sres{background:#2b2545;color:#f1edff}
body.dark #home{background:linear-gradient(180deg,#1f1b33,#2a2147)}body.dark .node{background:#352d57}body.dark .node b{background:#2b2545}

/* tablet */
@media (min-width:700px){
 #home>*,#welcome>*{max-width:760px;margin-left:auto;margin-right:auto}
 #home{padding-left:28px;padding-right:28px}
 #home>.daily{display:block;width:100%;max-width:760px;margin-left:auto!important;margin-right:auto!important}
 .node{flex:0 0 112px;padding:12px 6px}.node b{font-size:26px}.node small{font-size:12px}
 .path{flex-wrap:wrap;overflow:visible}
 .modes{grid-template-columns:repeat(3,1fr)}.album{grid-template-columns:repeat(5,1fr)}.shop{grid-template-columns:repeat(4,1fr)}
 .achs{display:grid;grid-template-columns:1fr 1fr}
 .rg{padding:12px 4px;font-size:13px}.rg b{font-size:30px}
 .top{max-width:900px;margin:0 auto;left:0;right:0}
 #nav{max-width:760px;left:50%;transform:translateX(-50%);border-radius:22px;bottom:calc(10px + env(safe-area-inset-bottom));padding:8px}
 #quiz{left:50%;right:auto;width:min(640px,calc(100vw - 140px));transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top))}
 #quiz .q,#casebox,#boss{margin-left:0;margin-right:0}
 #quiz .q{padding:14px 20px}#quiz .q h4{font-size:24px}#quiz .q small{font-size:13px}#quiz .q .en2{font-size:15px}
 #casebox{font-size:16px;max-height:30vh}
 #opts{left:50%;right:auto;width:min(760px,calc(100vw - 48px));transform:translateX(-50%);display:none;grid-template-columns:1fr 1fr;bottom:calc(90px + env(safe-area-inset-bottom))}
 #opts[style*="flex"]{display:grid!important}
 #opts button{font-size:16px;padding:14px 18px}#opts button small{font-size:13px}
 #sheet{left:50%;right:auto;width:min(620px,calc(100vw - 48px));margin-left:calc(min(620px,calc(100vw - 48px))/-2);bottom:calc(90px + env(safe-area-inset-bottom));max-height:46vh}
 #layers,#tools{top:calc(80px + env(safe-area-inset-top))}#layers{left:16px}#tools{right:16px}
 #layers button,#tools button{width:54px;height:54px;font-size:24px}
 #pups{right:16px;top:calc(330px + env(safe-area-inset-top))}#pups button{width:56px;height:60px;font-size:22px}
 #tracebar span{font-size:12.5px;padding:3px 9px}
}
@media (min-width:1000px) and (orientation:landscape){
 #quiz{left:24px;transform:none;width:420px}
 #opts{left:auto;right:24px;transform:none;width:400px;grid-template-columns:1fr;bottom:calc(100px + env(safe-area-inset-bottom))}
 #sheet{left:auto;right:24px;margin-left:0;width:420px;max-height:70vh}
 #casebox{max-height:50vh}
 #pups{right:440px;top:auto;bottom:calc(100px + env(safe-area-inset-bottom))}
 #layers{top:auto;bottom:110px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="load"><div class="ico">🫀</div><div id="lt">Kadavra hazırlanıyor…</div></div>
<div class="top"><div class="pill" id="prof"><div style="flex:1;min-width:0"><div class="nm" id="pname">Dr.</div><small id="plvl">Stajyer</small><div class="xp"><div id="pxp"></div></div></div></div><div class="pill chip" id="pstreak">🔥 0</div><div class="pill chip" id="homeBtn">🏠</div></div>
<div id="layers"></div>
<div id="tools"><button id="tSearch" title="Ara">🔍</button><button id="tIso" title="Seçileni izole et">🎯</button><button id="tXray" title="Röntgen">🩻</button><button id="tReset" title="Görünümü sıfırla">🔄</button></div>
<div id="search"><input id="sin" placeholder="Latince veya İngilizce ara…"><div id="sres"></div></div>

function buildCH(){const ri=RI();CH=CHDEF[RID]();const nc=CH.length;
 CH.forEach((c,ci)=>{const df=Math.min(1,(ri+ci/(nc-1)*.95)/3.95);c.df=df;
  c.lv.forEach((l,li)=>{l.lab=(ci+1)+'-'+(li+1);l.id=KP+l.lab;l.ch=ci;l.df=df;if(l.n&&l.t!=='clinic')l.n=l.n+Math.round(df*4)});
  const fin=ci===nc-1;c.lv.push({t:'boss',lab:(ci+1)+'-B',id:KP+(ci+1)+'-B',ch:ci,df,ti:c.b,pool:c.boss,n:99,boss:{name:c.b,hp:100+40*ri+(fin?60:0)}})});
 ALL_LV=CH.flatMap(c=>c.lv)}
const finalId=rid=>{const c=CHDEF[rid]();return (rid==='ul'?'':rid+':')+c.length+'-B'};
const regionOpen=i=>i===0||(S.lv[finalId(REGS[i-1].id)]||0)>0;
const unlocked=l=>{const i=ALL_LV.indexOf(l);return i===0||(S.lv[ALL_LV[i-1].id]||0)>0};
const qTime=d=>d.t==='boss'?Math.round(14-6*(d.df||0)):Math.round(22-12*(d.df||0));
function simScore(a,b){let s=0;if(a.mu&&b.mu&&a.mu.g===b.mu.g)s+=3;const wa=a.en.toLowerCase().split(/[\s()]+/).filter(w=>w.length>3),wb=b.en.toLowerCase().split(/[\s()]+/);wa.forEach(w=>{if(wb.includes(w))s+=1.5});if(a.en.split(' ')[0]===b.en.split(' ')[0])s+=1;return s}
function distract(it,cands,n,df){cands=shuf(cands.slice());if(!df||df<.25)return cands.slice(0,n);const sc=cands.map(c=>[c,simScore(it,c)+Math.random()*(3-2.5*df)]).sort((x,y)=>y[1]-x[1]);return sc.slice(0,n).map(x=>x[0])}
